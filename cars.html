<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque — Reinacar Premium Motors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0f;
        }
        .font-display {
            font-family: 'Orbitron', sans-serif;
        }
        .neon-border {
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }
        .car-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 255, 0.2);
            transition: all 0.3s ease;
        }
        .car-card:hover {
            border-color: rgba(255, 0, 255, 0.6);
            box-shadow: 0 10px 40px rgba(255, 0, 255, 0.2);
            transform: translateY(-5px);
        }
        .filter-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 255, 0.3);
            color: #f3f4f6;
            transition: all 0.3s;
        }
        .filter-input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
            outline: none;
        }
        .filter-input option {
            background-color: #1a1a2e;
            color: #f3f4f6;
        }
        .glow-button {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            transition: all 0.3s ease;
        }
        .glow-button:hover {
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="text-gray-100">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-black/80 backdrop-blur-md border-b border-pink-500/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <i data-lucide="car" class="w-8 h-8 text-pink-500"></i>
                    <span class="font-display text-2xl font-bold text-white tracking-wider">REINACAR</span>
                </div>
                <div class="hidden md:block">
                    <div class="flex items-center space-x-8">
                        <a href="index.html" class="text-gray-300 hover:text-pink-400 transition-colors">Início</a>
                        <a href="cars.html" class="text-pink-400 font-medium">Estoque</a>
                        <a href="contact.html" class="text-gray-300 hover:text-pink-400 transition-colors">Contato</a>
                    </div>
                </div>
                <div class="md:hidden">
                    <button class="text-gray-300">
                        <i data-lucide="menu" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="pt-32 pb-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        <h1 class="font-display text-4xl md:text-5xl font-bold text-center mb-4">
            Nosso <span class="text-pink-500">Estoque</span>
        </h1>
        <p class="text-gray-400 text-center text-lg">Encontre o carro dos seus sonhos</p>
    </div>

    <!-- Filters -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mb-12">
        <div class="bg-white/5 rounded-2xl p-6 border border-pink-500/20 backdrop-blur-sm">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="search-input" placeholder="Buscar por modelo..." class="filter-input text-white px-4 py-3 rounded-lg placeholder-gray-500">
                <select id="brand-filter" class="filter-input px-4 py-3 rounded-lg">
                    <option value="">Todas as Marcas</option>
                    <option value="porsche">Porsche</option>
                    <option value="bmw">BMW</option>
                    <option value="audi">Audi</option>
                    <option value="mercedes">Mercedes</option>
                    <option value="ferrari">Ferrari</option>
                    <option value="lamborghini">Lamborghini</option>
                    <option value="mclaren">McLaren</option>
                </select>
                <select id="price-filter" class="filter-input px-4 py-3 rounded-lg">
                    <option value="">Todos os Preços</option>
                    <option value="0-300">Até R$ 300.000</option>
                    <option value="300-600">R$ 300.000 - R$ 600.000</option>
                    <option value="600-1000">R$ 600.000 - R$ 1.000.000</option>
                    <option value="1000+">Acima de R$ 1.000.000</option>
                </select>
                <select id="year-filter" class="filter-input px-4 py-3 rounded-lg">
                    <option value="">Todos os Anos</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Car Grid - Unlimited Listings -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
        <div id="car-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cars will be populated by JavaScript -->
        </div>
        
        <!-- Load More -->
        <div class="text-center mt-12">
            <button onclick="loadMore()" class="bg-pink-600 text-white px-8 py-3 rounded-full font-medium glow-button border border-pink-500/50 hover:border-pink-400">
                Carregar Mais
            </button>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black border-t border-pink-500/20 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center gap-2 mb-4 md:mb-0">
                    <i data-lucide="car" class="w-6 h-6 text-pink-500"></i>
                    <span class="font-display text-xl font-bold text-white">REINACAR</span>
                </div>
                <div class="flex gap-6 text-gray-400">
                    <a href="#" class="hover:text-pink-400 transition-colors"><i data-lucide="instagram" class="w-5 h-5"></i></a>
                    <a href="#" class="hover:text-pink-400 transition-colors"><i data-lucide="facebook" class="w-5 h-5"></i></a>
                    <a href="#" class="hover:text-pink-400 transition-colors"><i data-lucide="youtube" class="w-5 h-5"></i></a>
                </div>
            </div>
            <div class="mt-8 text-center text-gray-500 text-sm">
                © 2026 Reinacar Premium Motors. Todos os direitos reservados.
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        const carModels = [
            { name: "Porsche 911 GT3", brand: "porsche", year: 2023, price: 1250000, engine: "4.0L", tag: "Novo", tagColor: "bg-pink-600" },
            { name: "BMW M4 Competition", brand: "bmw", year: 2022, price: 580000, engine: "3.0L", tag: "Seminovo", tagColor: "bg-purple-600" },
            { name: "Audi R8 V10", brand: "audi", year: 2021, price: 920000, engine: "5.2L", tag: "Importado", tagColor: "bg-cyan-600" },
            { name: "Mercedes AMG GT", brand: "mercedes", year: 2023, price: 1100000, engine: "4.0L", tag: "Novo", tagColor: "bg-pink-600" },
            { name: "Ferrari F8 Tributo", brand: "ferrari", year: 2022, price: 2500000, engine: "3.9L", tag: "Importado", tagColor: "bg-cyan-600" },
            { name: "Lamborghini Huracan", brand: "lamborghini", year: 2021, price: 2300000, engine: "5.2L", tag: "Seminovo", tagColor: "bg-purple-600" },
            { name: "Porsche Taycan", brand: "porsche", year: 2023, price: 750000, engine: "Elétrico", tag: "Novo", tagColor: "bg-pink-600" },
            { name: "BMW i8", brand: "bmw", year: 2020, price: 450000, engine: "Hybrid", tag: "Seminovo", tagColor: "bg-purple-600" },
            { name: "Audi RS7", brand: "audi", year: 2023, price: 890000, engine: "4.0L", tag: "Novo", tagColor: "bg-pink-600" },
            { name: "Mercedes C63 AMG", brand: "mercedes", year: 2022, price: 520000, engine: "4.0L", tag: "Seminovo", tagColor: "bg-purple-600" },
            { name: "Ferrari 488 Spider", brand: "ferrari", year: 2019, price: 2100000, engine: "3.9L", tag: "Importado", tagColor: "bg-cyan-600" },
            { name: "McLaren 720S", brand: "mclaren", year: 2021, price: 1800000, engine: "4.0L", tag: "Seminovo", tagColor: "bg-purple-600" },
            { name: "Porsche 918 Spyder", brand: "porsche", year: 2020, price: 3200000, engine: "Hybrid", tag: "Importado", tagColor: "bg-cyan-600" },
            { name: "BMW M8 Competition", brand: "bmw", year: 2023, price: 1400000, engine: "4.4L", tag: "Novo", tagColor: "bg-pink-600" },
            { name: "Audi e-tron GT", brand: "audi", year: 2022, price: 850000, engine: "Elétrico", tag: "Seminovo", tagColor: "bg-purple-600" },
            { name: "Mercedes AMG One", brand: "mercedes", year: 2023, price: 2800000, engine: "Hybrid", tag: "Novo", tagColor: "bg-pink-600" },
        ];

        let currentIndex = 0;
        const carsPerLoad = 12;
        let displayedCars = [];

        function formatPrice(price) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(price);
        }

        function createCarCard(car, index) {
            return `
                <div class="car-card rounded-2xl overflow-hidden group cursor-pointer">
                    <div class="relative h-56 overflow-hidden bg-gradient-to-br from-pink-900/30 to-purple-900/30">
                        <img src="https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=640&h=360&fit=crop" alt="${car.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.style.display='none'">
                        <div class="absolute top-4 right-4 ${car.tagColor} text-white px-3 py-1 rounded-full text-xs font-bold">${car.tag}</div>
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-3"></div>
                    </div>
                    <div class="p-5">
                        <h3 class="font-display text-lg font-bold text-white mb-1">${car.name}</h3>
                        <p class="text-gray-400 text-sm mb-3">${car.year} • ${car.engine} • Automático</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xl font-bold text-pink-400">${formatPrice(car.price)}</span>
                            <button class="text-pink-400 hover:text-pink-300 bg-pink-500/10 p-2 rounded-full hover:bg-pink-500/20 transition-colors">
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterCars() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const brandFilter = document.getElementById('brand-filter').value;
            const priceFilter = document.getElementById('price-filter').value;
            const yearFilter = document.getElementById('year-filter').value;

            return carModels.filter(car => {
                const matchSearch = car.name.toLowerCase().includes(searchTerm);
                const matchBrand = !brandFilter || car.brand === brandFilter;
                
                let matchPrice = true;
                if (priceFilter) {
                    if (priceFilter === '0-300') matchPrice = car.price <= 300000;
                    else if (priceFilter === '300-600') matchPrice = car.price > 300000 && car.price <= 600000;
                    else if (priceFilter === '600-1000') matchPrice = car.price > 600000 && car.price <= 1000000;
                    else if (priceFilter === '1000+') matchPrice = car.price > 1000000;
                }

                const matchYear = !yearFilter || car.year.toString() === yearFilter;

                return matchSearch && matchBrand && matchPrice && matchYear;
            });
        }

        function updateGrid() {
            currentIndex = 0;
            displayedCars = filterCars();
            const grid = document.getElementById('car-grid');
            grid.innerHTML = '';
            loadMore();
        }

        function loadMore() {
            const grid = document.getElementById('car-grid');
            let html = '';
            
            for (let i = 0; i < carsPerLoad && currentIndex < displayedCars.length; i++) {
                const car = displayedCars[currentIndex];
                html += createCarCard(car, currentIndex);
                currentIndex++;
            }
            
            if (html) {
                grid.innerHTML += html;
                lucide.createIcons();
            }
        }

        // Add event listeners
        document.getElementById('search-input').addEventListener('input', updateGrid);
        document.getElementById('brand-filter').addEventListener('change', updateGrid);
        document.getElementById('price-filter').addEventListener('change', updateGrid);
        document.getElementById('year-filter').addEventListener('change', updateGrid);

        // Initial load
        displayedCars = carModels;
        loadMore();
    </script>
</body>
</html>
